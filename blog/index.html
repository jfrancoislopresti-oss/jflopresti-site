<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog : site web, Google et réseaux sociaux pour artisans et indépendants — Alpes-de-Haute-Provence | Jean-François Lopresti</title>
<meta name="description" content="Conseils simples pour les artisans, commerçants et indépendants des Alpes-de-Haute-Provence et de PACA : créer son site, être visible sur Google, animer ses réseaux sociaux et trouver des clients en ligne.">
<link rel="canonical" href="https://jflopresti.fr/blog/">
<link rel="canonical" href="https://jflopresti.fr/blog/">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="shortcut icon" href="/favicon.svg">
<meta name="theme-color" content="#E8541A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--bg2:#F7F6F4;--bg3:#F0EEE9;--accent:#E8541A;--accent-h:#1B3A5C;--accent-l:#FEF0EB;--text:#1A1A1A;--muted:#6B6B6B;--border:#E5E3DF;--shadow-h:0 6px 28px rgba(232,84,26,0.18);}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{background:linear-gradient(to bottom, rgba(232,84,26,0.12) 0%, #FFFFFF 50%, rgba(27,58,92,0.13) 100%);background-attachment:fixed;color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1.1rem 4rem;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
.nav-logo{text-decoration:none;display:inline-flex;align-items:center;}
.nav-back{font-size:.85rem;font-weight:500;color:var(--muted);text-decoration:none;transition:color .2s;}
.nav-back:hover{color:#1B3A5C;}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:8rem 4rem 6rem;}
.lbl{font-size:.72rem;font-weight:600;color:var(--accent);letter-spacing:.18em;text-transform:uppercase;margin-bottom:1rem;display:flex;align-items:center;gap:.7rem;}
.lbl::before{content:'';display:inline-block;width:28px;height:2px;background:var(--accent);border-radius:2px;}
h1{font-family:'Syne',sans-serif;font-size:clamp(2rem,4vw,3rem);font-weight:800;line-height:1.05;letter-spacing:-.02em;margin-bottom:.8rem;color:var(--text);}
h1 em{font-style:normal;color:var(--accent);}
.subtitle{font-size:1rem;color:var(--muted);margin-bottom:2.5rem;max-width:560px;line-height:1.7;}
.filters{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:2.5rem;}
.filter-btn{font-size:.75rem;font-weight:600;padding:.45rem 1rem;background:transparent;border:1.5px solid var(--border);color:var(--muted);cursor:pointer;border-radius:20px;transition:all .2s;}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(232,84,26,0.12);}
.blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;}
.blog-card{background:rgba(255,255,255,0.88);border:1.5px solid var(--border);overflow:hidden;transition:border-color .25s,transform .25s;display:flex;flex-direction:column;text-decoration:none;color:inherit;border-radius:4px;}
.blog-card:hover{border-color:var(--accent);transform:translateY(-3px);}
.blog-img{width:100%;background:var(--bg3);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.blog-img img{width:100%;height:auto;display:block;}
.blog-img-placeholder{padding:2.5rem 0;font-size:1.5rem;color:var(--muted);opacity:.3;}
.blog-meta{display:flex;gap:.7rem;align-items:center;padding:1rem 1.3rem .4rem;}
.blog-cat{font-size:.65rem;font-weight:700;color:var(--accent);background:var(--accent-l);padding:.2rem .6rem;border-radius:20px;}
.blog-date{font-size:.65rem;color:var(--muted);}
h2.blog-title{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700;color:#1B3A5C;padding:.4rem 1.3rem .7rem;line-height:1.3;}
.blog-excerpt{font-size:.8rem;color:var(--muted);line-height:1.65;padding:0 1.3rem 1rem;flex:1;}
.blog-link{display:inline-flex;align-items:center;gap:.4rem;margin:auto 1.3rem 1.3rem;font-size:.78rem;font-weight:600;color:var(--accent);}
.empty{text-align:center;padding:5rem 2rem;color:var(--muted);grid-column:1/-1;}
.hidden{display:none;}
footer{padding:2rem 4rem;border-top:1.5px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;}
.ft-copy{font-size:.72rem;color:var(--muted);}
.ft-logo{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:800;color:#1B3A5C;}
@media(max-width:900px){nav{padding:1rem 1.5rem;}main{position:relative;z-index:1;padding:6rem 1.5rem 4rem;}.blog-grid{grid-template-columns:1fr;}footer{padding:2rem 1.5rem;flex-direction:column;text-align:center;}}

.abo-card, .blog-card {
  transform-style: preserve-3d;
  transform: perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  will-change: transform;
}
.block {
  will-change: transform;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
</style>
</head>
<body>

<script>
(function(){
  const canvas=document.getElementById("particles-canvas");
  const ctx=canvas.getContext("2d");
  let W,H,pts=[],lastScroll=0;
  const COLORS=["rgba(232,84,26,","rgba(27,58,92,","rgba(232,84,26,","rgba(27,58,92,"];
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
  resize();window.addEventListener("resize",resize,{passive:true});
  function mkPt(){return{x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,r:Math.random()*2+.5,c:COLORS[Math.floor(Math.random()*COLORS.length)],a:Math.random()*.5+.15};}
  for(let i=0;i<70;i++)pts.push(mkPt());
  window.addEventListener("scroll",()=>{
    const delta=window.scrollY-lastScroll;
    pts.forEach(p=>{p.y-=delta*0.3;if(p.y<-10)p.y=H+10;if(p.y>H+10)p.y=-10;});
    lastScroll=window.scrollY;
  },{passive:true});
  function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.c+p.a+")";ctx.fill();
    });
    for(let i=0;i<pts.length;i++){for(let j=i+1;j<pts.length;j++){
      const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<130){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);
      ctx.strokeStyle=pts[i].c+(0.12*(1-d/130))+")";ctx.lineWidth=.5;ctx.stroke();}
    }}
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
<canvas id="particles-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:0.4;"></canvas>
<script>
(function(){
  var canvas = document.getElementById('particles-canvas');
  var ctx = canvas.getContext('2d');
  var W, H, pts = [], lastScroll = 0;
  var COLORS = ['rgba(232,84,26,','rgba(27,58,92,'];
  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize, {passive:true});
  function mkPt(){ return {x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.5, vy:(Math.random()-.5)*.5, r:Math.random()*2+.5, c:COLORS[Math.floor(Math.random()*2)], a:Math.random()*.5+.15}; }
  for(var i=0;i<60;i++) pts.push(mkPt());
  window.addEventListener('scroll', function(){
    var delta = window.scrollY - lastScroll;
    pts.forEach(function(p){ p.y -= delta*0.3; if(p.y<-10)p.y=H+10; if(p.y>H+10)p.y=-10; });
    lastScroll = window.scrollY;
  }, {passive:true});
  function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(function(p){
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=H; if(p.y>H)p.y=0;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.c+p.a+')'; ctx.fill();
    });
    for(var i=0;i<pts.length;i++) for(var j=i+1;j<pts.length;j++){
      var dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, d=Math.sqrt(dx*dx+dy*dy);
      if(d<120){ ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y);
        ctx.strokeStyle=pts[i].c+(0.1*(1-d/120))+')'; ctx.lineWidth=.5; ctx.stroke(); }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
<script>
(function(){
  var TILT_MAX = 10;
  var cards = document.querySelectorAll('.abo-card, .blog-card, .block, .price-card');
  cards.forEach(function(card){
    card.addEventListener('mousemove', function(e){
      var rect = card.getBoundingClientRect();
      var rx = -((e.clientY-(rect.top+rect.height/2))/(rect.height/2))*TILT_MAX;
      var ry = ((e.clientX-(rect.left+rect.width/2))/(rect.width/2))*TILT_MAX;
      card.style.transform = 'perspective(800px) rotateX('+rx+'deg) rotateY('+ry+'deg) translateZ(10px)';
      card.style.boxShadow = (-ry*1.2)+'px '+(rx*1.2)+'px 28px rgba(232,84,26,0.22),0 6px 32px rgba(27,58,92,0.12)';
    });
    card.addEventListener('mouseleave', function(){
      card.style.transition = 'transform 0.4s ease, box-shadow 0.4s ease';
      card.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg) translateZ(0)';
      card.style.boxShadow = '';
    });
    card.addEventListener('mouseenter', function(){
      card.style.transition = 'transform 0.1s ease, box-shadow 0.1s ease';
    });
  });
  window.addEventListener('scroll', function(){
    document.querySelectorAll('h1, h2').forEach(function(el){
      var rect = el.getBoundingClientRect();
      var offset = (rect.top + rect.height/2 - window.innerHeight/2) * -0.04;
      el.style.transform = 'translateY('+offset+'px)';
    });
  }, {passive:true});
})();
</script>
